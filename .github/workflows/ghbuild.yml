# This workflow reuses the openHIE GitHub action for building IGs
# Initial idea by Carl Leitner, developed by Elliot Silver, available from: https://www.argentixinfo.com/archives/156
# Change log:
# v0.1.0
# 2021-06-18: publish default branches to / , other branches branches/<branch>
# 2021-11-26: reusable workflow

name: GitHub Pages build

# Controls when the action will run.
on:
  # WHO keeps its own publishing (owner decision, 2026-11-19): this repository
  # builds and publishes from `master`, and builds every pull request to it.
  # The harness's site-publish.yml is not used here.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  call_build:
    permissions:
      contents: write       # gh-pages deploy
      pull-requests: write  # PR build-status comment
    uses: WorldHealthOrganization/smart-base/.github/workflows/ghbuild.yml@main
